name: Validate Release Manifest

on:
  release:
    types: [published]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Manifest
        id: extract
        run: |
          echo "${{ github.event.release.body }}" | sed 's/```json//g' | sed 's/```//g' > manifest.json

      - name: Validate JSON Syntax
        run: |
          # Try to parse the file with jq.
          # If it's not valid JSON, jq will exit with an error and fail the job.
          jq . manifest.json

      - name: Validate Schema Structure
        run: |
          # Ensure required top-level keys exist
          jq -e '.version' manifest.json
          jq -e '.artifacts' manifest.json
          
          # Ensure categories exist (optional but recommended for structure)
          jq -e '.artifacts.core' manifest.json
          jq -e '.artifacts.enablers' manifest.json
          jq -e '.artifacts.sectors' manifest.json
          jq -e '.artifacts.workers' manifest.json